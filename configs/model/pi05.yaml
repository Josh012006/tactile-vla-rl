# pi0.5 (flow matching, action expert), DROID joint-position weights. MODEL side only: the task and the algorithm have their own files
# (configs/{task,algo}); touch is switched on per component in the blocks below.
#
# Code: the openpi fork Josh012006/openpi (branch expo_ft), submodule third_party/openpi, pinned by the commit that git records for
# the submodule (f7cfe2d2e29abdc73ccb9ef0495990f3fc076234 when this file was written): the SAME commit as in expo-ft.
name: pi05
family: pi05

# Name of a TrainConfig in third_party/openpi/src/openpi/training/config.py (tests/test_models_pin.py checks that it exists). It provides
# the data pipeline and the DROID norm stats; its Gemma variants are OVERRIDDEN by the LoRA keys below (src/models/openpi_config.py), and its
# weights by `checkpoint` (src/models/loading.py), so the "lora" in its name only says that it is the config expo-ft evaluated and fine-tuned.
openpi_config: expo_pi05_droid_lora_finetune_sft_joint_state
checkpoint: gs://openpi-assets/checkpoints/pi05_droid_jointpos          # params/ and assets/ (norm stats) live there

# ---- the components of the model: one block each, same keys (src/models/settings.py) ------------------------------------------------
#   use_lora      LoRA on this component's Gemma weights, as openpi has it (the weights are frozen, LoRA matrices are trained; openpi's freeze
#                 filter leaves the SigLIP vision tower and the action projections trainable too). false: no LoRA (trained in full if trained).
#                 The two components are independent. Default true.
#   lora_rank     openpi's defaults: 16 for the VLM (gemma_2b_lora), 32 for the action expert (gemma_300m_lora). Another rank changes the model
#                 structure: use the same value wherever a checkpoint trained with it is loaded.
#   use_tactile   the 56 taxels (extra/tactile) are given to this component.            Default false.
#   use_force     the force signals (extra/ft_force, extra/gripper_effort) are given to it.   Default false.
#   force_mode    measured | proxy. `proxy`: the force is estimated from the encoders instead of read (7 joint tracking residuals, arXiv 2610.23849's principle: src/touch/features.py).
# Touch is OFF everywhere: this is the task-only baseline. Turning it on needs a robot with the signals (robotiq_2f85_tsf for the taxels)
# and an injection for the component (src/touch/injection: none is written yet, a component that asks for touch stops with an error that
# says so). Command-line / algorithm overrides use the same names: vlm.use_lora=false, action_head.use_tactile=true, ...
vlm:                           # PaliGemma's Gemma 2B (+ SigLIP)
  use_lora: true
  lora_rank: 16
  use_tactile: false
  use_force: false
  force_mode: measured
action_head:                   # the action expert (Gemma 300M)
  use_lora: true
  lora_rank: 32
  use_tactile: false
  use_force: false
  force_mode: measured

# Normalisation statistics. Without this block the ones saved with `checkpoint` are used (DROID's, `assets/droid`): what the base weights were trained with. With it:
#   norm_stats:
#     dir: assets/forge_demo_norm                    # <dir>/<asset_id>/norm_stats.json, relative to the repository root unless absolute
#     asset_id: forge_demos_robotiq_noisy            # written by python -m scripts.demos.compute_demo_norm_stats
# Set it from an experiment file (`model_set: norm_stats.dir: ...`) or `--model-set norm_stats.dir=... --model-set norm_stats.asset_id=...`; a policy that loads weights
# trained with other statistics than the base ones must be given the same block (the checkpoints of src/algos/sft.py hold a copy in assets/ and the block in meta.json).

# How the weights are loaded (src/models/loading.py). The checkpoint has NO LoRA tensors, so openpi's strict loading fails with LoRA
# ("symmetric difference of key sets: {'lora_a', 'lora_b'}"). expo-ft loads through a weight_loader, which keeps the checkpoint weights
# and takes the LoRA parameters from the model's own initialisation: `load: weight_loader` does the same. openpi initialises lora_a AND
# lora_b with normal(0.01) whereas the LoRA paper (Hu et al. 2021) starts from B = 0: a freshly initialised LoRA model is the base model
# plus a small random perturbation (1 % of the chunk on real observations, 2026-11-10), not exactly the base function. No LoRA in any
# component is the exact base function (`python -m scripts.probe_vla --model pi05 --no-lora`).
load: weight_loader

action_dim: 8                  # 7 joints + gripper; the model itself works on 32 (padded), 8 are read
action_horizon: 16             # actions per chunk
# What the base weights return (established in expo-ft, October 2026): a chunk of OFFSETS from the joint state at the moment of
# the plan, gripper absolute. The caller adds the chunk-start state back (expo-ft: chunk_action_reference: chunk_start_state);
# this config has no AbsoluteActions in its outputs on purpose, so the state is added once.
output_semantics: offsets_from_chunk_start_state
