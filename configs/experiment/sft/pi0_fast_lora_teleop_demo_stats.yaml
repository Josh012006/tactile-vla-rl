# SFT of pi0-FAST with LoRA on the FORGE PegInsert teleoperated demonstrations (50 episodes, all of them), with the normalisation statistics of the noisy demonstrations over 10-step chunks.
# One of the PAIR that decides the normalisation statistics of pi0-FAST: the same run with the checkpoint's own statistics (pi0_fast_lora_teleop_droid_stats.yaml) (docs/algos/sft.md, section 2b). Measured on the demonstrations with
# scripts/fast_tokens.py: the statistics of the demonstrations cut the reconstruction error of FAST from 0.0112 to 0.0017 rad but make 7 times more chunks undecodable (0.22 % against 0.03 %);
# the success rate in the environment of the two runs decides. The scripted and noisy pi0-FAST runs wait for that.
# Touch is NOT used: this is the SFT of expo-ft (cameras, joints, gripper, prompt), whose checkpoint the RL starts from. The taxels in the demonstrations are ignored.
# Everything else (steps, batch, learning rate, checkpoints every 200 steps, resume snapshots, wandb) is configs/algo/sft.yaml; the model is configs/model/pi0_fast.yaml (LoRA).
#
#   sbatch jobs/job_sft_lora.sh --experiment configs/experiment/sft/pi0_fast_lora_teleop_demo_stats.yaml
#   continue it:  sbatch jobs/job_sft_lora.sh --resume runs/sft/peg_insert/peg_insert_pi0_fast_lora_teleop_demo_stats
# Output: runs/sft/peg_insert/peg_insert_pi0_fast_lora_teleop_demo_stats/
name: peg_insert_pi0_fast_lora_teleop_demo_stats
description: "pi0-FAST LoRA SFT, PegInsert, teleoperated demonstrations, normalisation statistics of the noisy demonstrations (10 steps), no touch"
model: pi0_fast
full: false
demos:
  - demos/isaaclab/ForgePegInsert_Robotiq_teleop
set:
  output_root: runs/sft/peg_insert
model_set:                       # touch off in every component the model has (it is off in the model YAML too: written here so that the file says it)
  vlm.use_tactile: false
  vlm.use_force: false
  norm_stats.dir: assets/forge_demo_norm            # <dir>/<asset_id>/norm_stats.json: python -m scripts.demos.compute_demo_norm_stats --horizon 10 (docs/algos/sft.md, section 2b)
  norm_stats.asset_id: forge_demos_robotiq_noisy_h10
