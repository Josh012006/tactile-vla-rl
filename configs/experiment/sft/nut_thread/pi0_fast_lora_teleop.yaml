# SFT of pi0-FAST with LoRA on the FORGE NutThread teleoperated demonstrations (all the episodes of the folder, at most `num_demos`).
# Touch is NOT used: cameras, joints, gripper, prompt only, as the PegInsert SFTs the RL starts from. The taxels in the demonstrations are ignored.
# Normalisation statistics: those computed on THE DEMONSTRATIONS OF THIS RUN, over 10-step chunks (assets/forge_demo_norm/forge_demos_robotiq_nut_thread_teleop_h10, to compute first once the
# demonstrations exist: docs/demos.md; compute_demo_norm_stats --horizon 10 --droid-stats <the PolaRiS checkpoint's norm_stats.json>): the rule of Albert Zhan (docs/algos/sft.md, section 2b).
# Check the FAST round trip before training (scripts/fast_roundtrip.py --demos-dir <demos> --stats assets/forge_demo_norm:forge_demos_robotiq_nut_thread_teleop_h10): many undecodable chunks would show it.
# NOT MEASURED YET for this task: the number of demonstrations (50 is PegInsert's: set `num_demos` to what is collected), and the training length / learning rate of configs/algo/sft.yaml
# (chosen on PegInsert). The task YAML below has the prompt the demonstrations carry; the script refuses a folder whose prompt is another one.
# Everything else (steps, batch, learning rate, checkpoints every 200 steps, resume snapshots, wandb) is configs/algo/sft.yaml; the model is configs/model/pi0_fast.yaml (LoRA).
#
#   sbatch jobs/job_sft_lora.sh --experiment configs/experiment/sft/nut_thread/pi0_fast_lora_teleop.yaml
#   continue it:  sbatch jobs/job_sft_lora.sh --resume runs/sft/nut_thread/nut_thread_pi0_fast_lora_teleop
#   evaluate it:  sbatch jobs/job_eval_sft.sh --run runs/sft/nut_thread/nut_thread_pi0_fast_lora_teleop --n-episodes 50        (the env YAML is the `task` below: nothing else to give)
# Output: runs/sft/nut_thread/nut_thread_pi0_fast_lora_teleop/
name: nut_thread_pi0_fast_lora_teleop
description: "pi0-FAST LoRA SFT, NutThread, teleoperated demonstrations, normalisation statistics of its own demonstrations (10 steps), no touch"
model: pi0_fast
full: false
task: configs/task/nut_thread_forge.yaml         # recorded in the run's config.json: the evaluation and the RL use this env YAML; also checks the prompt of the demonstrations against it
demos:
  - demos/isaaclab/ForgeNutThread_Robotiq_teleop
set:
  output_root: runs/sft/nut_thread
  num_demos: 50                    # the first 50 episodes of the folder: PegInsert's number, to be set to what is collected
  seed: 42                         # the SFT seed, really used by the training: LoRA initialisation, order of the rows, noise
model_set:                       # touch off in every component the model has (it is off in the model YAML too: written here so that the file says it)
  vlm.use_tactile: false
  vlm.use_force: false
  norm_stats.dir: assets/forge_demo_norm            # <dir>/<asset_id>/norm_stats.json
  norm_stats.asset_id: forge_demos_robotiq_nut_thread_teleop_h10
