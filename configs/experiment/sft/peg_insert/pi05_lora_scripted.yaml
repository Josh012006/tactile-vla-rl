# SFT of pi0.5 with LoRA on the FORGE PegInsert clean scripted demonstrations (50 episodes, all of them).
# Touch is NOT used: this is the SFT of expo-ft (cameras, joints, gripper, prompt), whose checkpoint the RL starts from. The taxels in the demonstrations are ignored.
# Normalisation statistics: those computed on THE DEMONSTRATIONS OF THIS RUN (assets/forge_demo_norm/forge_demos_robotiq_scripted, 16 steps; scripts/demos/compute_demo_norm_stats.py): a model trained on a set
# of demonstrations normalises with the statistics of that set (rule of Albert Zhan, docs/algos/sft.md, section 2b). The DROID ones squeeze FORGE's small motions into a few percent of [-1, 1].
# The checkpoints carry them (checkpoints/<step>/assets/); an evaluation or an RL run that loads one of them must use the same `norm_stats` block (model_set below).
# Everything else (steps, batch, learning rate, checkpoints every 200 steps, resume snapshots, wandb) is configs/algo/sft.yaml; the model is configs/model/pi05.yaml (LoRA).
#
#   sbatch jobs/job_sft_lora.sh --experiment configs/experiment/sft/peg_insert/pi05_lora_scripted.yaml
#   continue it:  sbatch jobs/job_sft_lora.sh --resume runs/sft/peg_insert/peg_insert_pi05_lora_scripted_demostats
# Output: runs/sft/peg_insert/peg_insert_pi05_lora_scripted_demostats/
name: peg_insert_pi05_lora_scripted_demostats
description: "pi0.5 LoRA SFT, PegInsert, clean scripted demonstrations, normalisation statistics of its own demonstrations, no touch"
model: pi05
full: false
task: configs/task/peg_insert_forge.yaml         # recorded in the run's config.json: the evaluation and the RL use this env YAML; also checks the prompt of the demonstrations against it
demos:
  - demos/isaaclab/ForgePegInsert_Robotiq_scripted
set:
  output_root: runs/sft/peg_insert
  num_demos: 50                    # the first 50 episodes of the folder (all of them): expo-ft's `num_data_sft: 50` (`--data.num-demos=50`), written here so that the file says it
  seed: 42                         # the SFT seed, really used by the training: LoRA initialisation, order of the rows, noise (expo-ft's SFT ran with openpi's default seed, 42)
model_set:                       # touch off in every component the model has (it is off in the model YAML too: written here so that the file says it)
  vlm.use_tactile: false
  vlm.use_force: false
  action_head.use_tactile: false
  action_head.use_force: false
  norm_stats.dir: assets/forge_demo_norm            # <dir>/<asset_id>/norm_stats.json
  norm_stats.asset_id: forge_demos_robotiq_scripted
