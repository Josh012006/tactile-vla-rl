# RL fine-tuning of pi0.5 (LoRA SFT checkpoint) on the FORGE PegInsert task: PA-RL variant A (global optimisation: top-m of k = 32 by Q, then distillation, no gradient ascent).
# Touch is NOT in the VLA (the SFT checkpoint is the same for every run); the critic's touch inputs (`critic_use_tactile`, `critic_use_force`) are off here, and a tactile variant is this file with them on.
# Everything not written here is configs/algo/rl.yaml (the paper's values), except the warm-up budget, written below; the model is configs/model/pi05.yaml. The SFT checkpoint to start from (`start: {run, step}`) is
# given on the command line (`--start <SFT run> <step>`, jobs/job_rl_*.sh), so that one experiment file serves every starting point (docs/algos/rl.md).
name: peg_insert_pi05_parl_global
description: "pi0.5 PA-RL variant A (global), PegInsert, one online critic, no touch"
model: pi05
set:
  output_root: runs/rl/peg_insert
  seed: 42                         # as the SFT main runs
  method: parl
  local_steps: 0
  warmup_episodes: 600             # warm-up budget of the study, the same as Best-of-N (rl.yaml keeps the paper's 50 / 5000). The rounds stay those of rl.yaml: 10 of 50 episodes
  warmup_critic_steps: 120000
  distill_selection: argmax         # label = the best candidate by Q (paper B.1); probes of 22-23 Nov. 2026 at warm-up 300/30k: argmax = softmax for the VLA alone, but critic + VLA held (53.2 at round 3) where softmax fell (47.2, paired +6.0, p = 0.005)
  distill_lr: 2.5e-8               # the only distillation lr that did not degrade the VLA in those probes (2.5e-7 and above, 8e-8, and 4 epochs at 2.5e-8, all degraded); calibrated on variant A, to be re-checked at 600/120k
