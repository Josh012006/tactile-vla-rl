# NOT MEASURED for NutThread: every number below (warm-up budget, number of rounds, candidates, learning rates) is PegInsert's, written to be revised once the NutThread SFT runs exist and have been evaluated.
# Starts from an SFT checkpoint trained on NutThread (configs/experiment/sft/nut_thread/): scripts/rl.py refuses a checkpoint of another task.
# RL fine-tuning of pi0.5 (LoRA SFT checkpoint) on the FORGE NutThread task: Best-of-N WITH TOUCH IN THE CRITIC. Identical to pi05_best_of_n.yaml except for the critic's inputs, so that
# the pair isolates what touch brings: the VLA stays frozen, the argmax of Q over k = 32 candidates is executed (Alg. 2 of the paper without the distillation, global optimisation only).
# Touch is NOT in the VLA (the SFT checkpoint is the same for every run); the critic receives the taxels (56 values) and the measured force (wrist force sensor + gripper effort, 4 values),
# each entry scaled by sign(x) * log1p(|x|), concatenated to the state feature (src/touch/features.py, docs/algos/rl.md). The force is the measured one, not the proxy.
# Needs the robot `robotiq_2f85_tsf` (the default of configs/task/nut_thread_forge.yaml): the server sends the taxels only for it.
# The SFT checkpoint to start from is given on the command line (`--start <SFT run> <step>`, jobs/job_rl_best_of_n.sh --experiment <this file>); the run folder is the `--run-name`
# (default: the experiment's `name`, so give one per starting point).
name: nut_thread_pi05_best_of_n_touch
description: "pi0.5 Best-of-N, NutThread, one online critic, tactile + measured force in the critic"
model: pi05
task: configs/task/nut_thread_forge.yaml         # the env YAML of the run (the SFT run it starts from must have been trained on the same task: scripts/rl.py refuses otherwise)
set:
  output_root: runs/rl/nut_thread
  seed: 42                         # as the SFT main runs
  method: best_of_n
  keep_top: 1
  local_steps: 0
  rollout_selection: argmax
  warmup_episodes: 600             # warm-up budget of the study (locked after the warm-up tests of Nov. 2026: 150 / 300 / 600 episodes, 30k / 60k / 120k critic updates; rl.yaml keeps the paper's 50 / 5000)
  warmup_critic_steps: 120000
  total_episodes: 1000             # 20 rounds of 50 episodes
  eval_every_rounds: 5             # in-run evaluations (100 episodes): after the warm-up, every 5 rounds and after the last one (rounds 0, 5, 10, 15, 20); the 500-episode evaluations are made by scripts/eval_rl.py
  critic_use_tactile: true         # the 56 taxels
  critic_use_force: true           # ft_force (3) + gripper_effort (1)
  critic_force_mode: measured      # not "proxy"
